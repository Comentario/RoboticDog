<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="sans-serif" font-size="14">
  <rect width="800" height="480" fill="#fff"/>
  <text x="20" y="28" font-size="18" font-weight="bold">Concept v0 - quadruped, 12 DoF (side view)</text>
  <line x1="20" y1="400" x2="500" y2="400" stroke="#888" stroke-width="2"/>
  <!-- patas traseras (atenuadas) -->
  <line x1="130" y1="180" x2="60" y2="270" stroke="#e80" stroke-width="10" opacity=".5"/>
  <line x1="60" y1="270" x2="138" y2="384" stroke="#3a5" stroke-width="8" opacity=".5"/>
  <!-- tronco y cabeza -->
  <rect x="100" y="150" width="300" height="60" fill="#d33" opacity=".9"/>
  <rect x="400" y="140" width="60" height="50" fill="#444"/>
  <!-- pata delantera -->
  <line x1="370" y1="180" x2="270" y2="280" stroke="#e80" stroke-width="10"/>
  <line x1="270" y1="280" x2="378" y2="384" stroke="#3a5" stroke-width="8"/>
  <circle cx="378" cy="392" r="8" fill="#111"/>
  <!-- marcadores numerados -->
  <g fill="#27c" stroke="#fff" stroke-width="2">
    <circle cx="370" cy="180" r="12"/><circle cx="360" cy="190" r="0"/><circle cx="270" cy="280" r="12"/>
  </g>
  <g fill="#fff" font-weight="bold" text-anchor="middle">
    <text x="370" y="185">1</text><text x="270" y="285">2</text>
  </g>
  <!-- etiquetas con flechas -->
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs>
  <g stroke="#555" stroke-width="1.2" marker-end="url(#a)" fill="none">
    <line x1="200" y1="100" x2="200" y2="148"/>
    <line x1="430" y1="100" x2="430" y2="138"/>
    <line x1="260" y1="245" x2="312" y2="232"/>
    <line x1="270" y1="352" x2="318" y2="335"/>
    <line x1="430" y1="392" x2="392" y2="392"/>
  </g>
  <g fill="#333">
    <text x="130" y="92">trunk 300 x 100 x 60 mm</text>
    <text x="395" y="92">head / camera</text>
    <text x="160" y="250">thigh 140 mm</text>
    <text x="160" y="357">shank 150 mm</text>
    <text x="438" y="397">foot</text>
  </g>
  <!-- leyenda -->
  <rect x="540" y="60" width="240" height="190" rx="8" fill="#f4f6f8" stroke="#ccd"/>
  <text x="556" y="86" font-weight="bold">Joints per leg</text>
  <circle cx="562" cy="110" r="10" fill="#27c"/><text x="562" y="115" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
  <text x="580" y="115">Hip: abduction (roll)</text>
  <text x="580" y="134" fill="#666" font-size="12">moves the leg sideways</text>
  <circle cx="562" cy="162" r="10" fill="#27c"/><text x="562" y="167" fill="#fff" text-anchor="middle" font-weight="bold">+</text>
  <text x="580" y="167">Hip: flexion (pitch)</text>
  <text x="580" y="186" fill="#666" font-size="12">forward/back, next to joint 1</text>
  <circle cx="562" cy="214" r="10" fill="#27c"/><text x="562" y="219" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
  <text x="580" y="219">Knee (pitch)</text>
  <rect x="540" y="270" width="240" height="110" rx="8" fill="#f4f6f8" stroke="#ccd"/>
  <text x="556" y="296" font-weight="bold">Specifications</text>
  <text x="556" y="320">Total length ~400 mm</text>
  <text x="556" y="340">Standing height ~210 mm</text>
  <text x="556" y="360">Mass 3-4 kg | 12 servos</text>
</svg>
